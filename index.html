<!DOCTYPE html>
<html>
  <meta charest="UTF -8">
  <title>Java 1</title>
  <body>
    <label>Numri i pare</label>
    <input type="number" id="nr1">
    <br>
    <label>Numri i dyte</label>
    <input type="number" id="nr2">
    <br>

    <button type="submit" onclick="sum()">Shumo</button>
    <button type="submit" onclick="minus()">Zbrit</button>
    <button type="submit" onclick="times()">Shumezim</button>
    <button type="submit" onclick="devide()">Pjestim</button>

    <p id="result"></p>

    <script>
      function sum(){
        let nr1=Number(document.getElementById('nr1').value);
        let nr2=Number(document.getElementById('nr2').value);
        let c=nr1+nr2;
        
        document.getElementById('result').innerHTML=c;
        
      }

       function minus(){
        let nr1=Number(document.getElementById('nr1').value);
        let nr2=Number(document.getElementById('nr2').value);
        let c=nr1-nr2;
        
        document.getElementById('result').innerHTML=c;
        
      }

       function times(){
        let nr1=Number(document.getElementById('nr1').value);
        let nr2=Number(document.getElementById('nr2').value);
        let c=nr1*nr2;
        
        document.getElementById('result').innerHTML=c;
        
      }

       function devide(){
        let nr1=Number(document.getElementById('nr1').value);
        let nr2=Number(document.getElementById('nr2').value);
        let c=nr1/nr2;
        
        document.getElementById('result').innerHTML=c;
        
      }
    </script>
  </body>
</html>
