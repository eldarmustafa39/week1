<!DOCTYPE html>
<html>
  <head>
    <meta charest="UTF -8">
    <title>Java 1</title>
    <style>
      #shumo{
        height:40;
        width:60;
      }    
    </style>
  </head>
  <body>
    <label>Numri i pare</label>
    <input type="number" id="nr1">
    <br>
    <label>Numri i dyte</label>
    <input type="number" id="nr2">
    <br>

    <button type="submit" onclick="sum()" id="shumo">Shumo</button>
    <button type="submit" onclick="minus()" id="Zbrit">Zbrit</button>
    <button type="submit" onclick="times()" id="Shumezim">Shumezim</button>
    <button type="submit" onclick="devide()" id="Pjestim">Pjestim</button>

    <p id="result"></p>

    <script>
      function sum(){
        let nr1=Number(document.getElementById('nr1').value);
        let nr2=Number(document.getElementById('nr2').value);
        let c=nr1+nr2;
        
        document.getElementById('result').innerHTML=c;
        
      }

       function minus(){
        let nr1=Number(document.getElementById('nr1').value);
        let nr2=Number(document.getElementById('nr2').value);
        let c=nr1-nr2;
        
        document.getElementById('result').innerHTML=c;
        
      }

       function times(){
        let nr1=Number(document.getElementById('nr1').value);
        let nr2=Number(document.getElementById('nr2').value);
        let c=nr1*nr2;
        
        document.getElementById('result').innerHTML=c;
        
      }

       function devide(){
         if(nr2===0)
         {
             document.getElementById('result').innerHTML="Nuk pjestohet me zero";
         }else{  
            let nr1=Number(document.getElementById('nr1').value);
            let nr2=Number(document.getElementById('nr2').value);
            let c=nr1/nr2;
        
        document.getElementById('result').innerHTML=c;
         }
      }
    </script>
  </body>
</html>
